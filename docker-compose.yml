version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lawyer-website
    restart: unless-stopped
    # Map host port 80 to container port 80
    ports:
      - "80:80"
    # Load environment variables from .env file
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=80
    networks:
      - app-network
    healthcheck:
      # Check if the app is responding on port 80
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  app-network:
    driver: bridge