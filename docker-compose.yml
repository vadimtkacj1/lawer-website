version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lawyer-website
    restart: unless-stopped
    # Map host port 80 to container port 80
    ports:
      - "80:80"
    # Load environment variables from .env file
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=80
    networks:
      - app-network
    volumes:
      # Persist optimized images across redeploys. Without this every deploy wipes
      # the cache and the first visitor pays the full re-encode for every image.
      # Only the images subdir — mounting all of .next/cache would carry stale
      # ISR/fetch data into a new build.
      - next-image-cache:/app/.next/cache/images
    healthcheck:
      # Node is always in the image; wget/curl are not (Alpine) — avoids false "unhealthy"
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:80',(r)=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  next-image-cache:

networks:
  app-network:
    driver: bridge