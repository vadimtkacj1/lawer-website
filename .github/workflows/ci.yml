name: CI/CD Production

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # Job 1: Verify that the code is stable and builds correctly
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint || echo "Linting skipped"

      - name: Build project
        run: npm run build

  # Job 2: Deploy to the production server via SSH
  deploy:
    runs-on: ubuntu-latest
    needs: test-and-build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    
    steps:
      - name: Deploy to Hetzner via SSH
        uses: appleboy/ssh-action@v1.2.1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          timeout: 300s
          command_timeout: 600s
          script: |
            set -e
            
            DEPLOY_PATH="${{ secrets.DEPLOY_PATH || '/var/www/lawyer-website' }}"
            REPO_URL="${{ github.server_url }}/${{ github.repository }}.git"
            
            # Create directory if it doesn't exist
            if [ ! -d "$DEPLOY_PATH" ]; then
              echo "Directory $DEPLOY_PATH does not exist. Creating..."
              mkdir -p "$DEPLOY_PATH"
            fi
            
            cd "$DEPLOY_PATH"
            
            # Check if it's a git repository, if not - clone it
            if [ ! -d ".git" ]; then
              echo "Cloning repository..."
              git clone "$REPO_URL" .
            fi
            
            # FIX: Force the server to match the GitHub repository
            # This overwrites local changes to docker-compose.yml or other tracked files
            echo "Fetching latest changes and forcing reset..."
            git fetch origin ${{ github.ref_name }}
            git reset --hard origin/${{ github.ref_name }}
            
            # Build new images (no-cache for clean build)
            # This will now use the docker-compose.yml from your REPOSITORY
            docker compose build --no-cache || exit 1
            
            # Recreate containers
            docker compose up -d || exit 1
            
            # Cleanup
            docker system prune -f
            
            # Verify the deployment
            docker compose ps